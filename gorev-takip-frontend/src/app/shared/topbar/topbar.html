<header class="topbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      [(ngModel)]="searchValue"
      (ngModelChange)="onSearchInput()"
      placeholder="Görev, proje, ekip ara..."
    />
  </div>

  <div class="topbar-right">
    <div class="notif-wrap">
      <button class="bell-btn" type="button" (click)="togglePanel()" aria-label="Bildirimler">
        <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
      </button>

      <div class="notif-panel" *ngIf="panelOpen">
        <div class="notif-panel-header">
          <span>Bildirimler</span>
          <button type="button" class="mark-all-btn" *ngIf="unreadCount > 0" (click)="markAllRead()">
            Tümünü okundu işaretle
          </button>
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0; else emptyNotif">
          <div
            class="notif-item"
            *ngFor="let n of notifications"
            [class.unread]="!n.isRead"
            (click)="openNotification(n)"
          >
            <p class="notif-message">{{ n.message }}</p>
            <span class="notif-time">{{ n.createdAt | date: 'd MMM, HH:mm' }}</span>
          </div>
        </div>
        <ng-template #emptyNotif>
          <p class="notif-empty" *ngIf="!loadFailed">Henüz bildirim yok.</p>
          <p class="notif-empty" *ngIf="loadFailed">Bildirimler yüklenemedi.</p>
        </ng-template>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">Çıkış Yap</button>
  </div>
</header>
