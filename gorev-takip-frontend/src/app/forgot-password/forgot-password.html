<div class="page">
  <div class="card">
    <div class="brand">
      <span class="logo-dot"></span>
      <span>Görev Takip</span>
    </div>

    <h1>Şifremi Unuttum</h1>
    <p class="subtitle">E-posta adresinizi girin, sıfırlama kodunu e-posta adresinize gönderelim.</p>

    <form (ngSubmit)="requestCode()">
      <label>E-posta</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="ornek@sirket.com" [disabled]="loading" />

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading">{{ loading ? 'Gönderiliyor...' : 'Kod Gönder' }}</button>
    </form>

    <a class="back-link" routerLink="/login">← Giriş sayfasına dön</a>
  </div>
</div>
