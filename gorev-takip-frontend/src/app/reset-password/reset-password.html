<div class="page">
  <div class="card">
    <div class="brand">
      <span class="logo-dot"></span>
      <span>Görev Takip</span>
    </div>

    <h1>Yeni Şifre Belirle</h1>
    <p class="info" *ngIf="infoMessage">{{ infoMessage }}</p>
    <p class="subtitle" *ngIf="!infoMessage">E-postanıza gönderdiğimiz kodu ve yeni şifrenizi girin.</p>

    <form (ngSubmit)="resetPassword()">
      <label>E-posta</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="ornek@sirket.com" [disabled]="loading" />

      <label>Sıfırlama Kodu</label>
      <input type="text" [(ngModel)]="token" name="token" required placeholder="6 haneli kod" [disabled]="loading" />

      <label>Yeni Şifre</label>
      <input type="password" [(ngModel)]="newPassword" name="newPassword" required placeholder="••••••••" [disabled]="loading" />

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading">{{ loading ? 'Kaydediliyor...' : 'Şifreyi Sıfırla' }}</button>
    </form>

    <a class="back-link" routerLink="/forgot-password">← Kod almadınız mı? Tekrar gönderin</a>
  </div>
</div>
